[project]
name = "figure-recreation"
version = "0.1.0"
description = "Verified reproduction of Kato and Matsuda (2022), Figures 6 and 7"
readme = "README.md"
authors = [
    { name = "mthobbs", email = "mthobbs@mit.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
